name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compile, upstream unit tests, release jars, remapping check
      - run: ./gradlew build --stacktrace
      # Headless in-game tests (Fabric GameTest)
      - run: ./gradlew runGametest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-report
          path: port/build/gametest/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: port/build/libs/*.jar
