plugins {
    id('fabric-loom').version("${loom_version}")
    id('java')
}

// Unofficial Fabric port of Mekanism (https://github.com/mekanism/Mekanism). See ../NOTES.md.
version = "${mod_version}+fabric.${port_revision}"
group = 'mekanism'
base { archivesName = 'Mekanism-Fabric-Unofficial' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'Fuzs (Forge Config API Port)'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository { maven { name = 'TerraformersMC (EMI)'; url = 'https://maven.terraformersmc.com/releases' } }
        filter { includeGroup('dev.emi') }
    }
    exclusiveContent {
        forRepository { maven { name = 'SquidDev (CC: Tweaked)'; url = 'https://maven.squiddev.cc' } }
        filter { includeGroup('cc.tweaked') }
    }
    exclusiveContent {
        // Only needed by upstream's annotation processor
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup('org.openzen.zencode'); includeGroup('com.blamejared.crafttweaker'); includeGroupByRegex('com[.]faux.*') }
    }
    exclusiveContent {
        forRepository { maven { name = 'bai (WTHIT)'; url = 'https://maven2.bai.lol' } }
        filter { includeGroup('mcp.mobius.waila'); includeGroup('lol.bai') }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository { maven { name = 'Ladysnake (Cardinal Components, used by Trinkets)'; url = 'https://maven.ladysnake.org/releases' } }
        filter { includeGroup('org.ladysnake.cardinal-components-api') }
    }
    mavenCentral()
}

// Packages from upstream that are not (yet) compiled in the Fabric port. Each entry is tracked in NOTES.md "Stubbed / disabled".
def excludedFromCompile = [
        // Curios client renderer (Curios is NeoForge-only; Fabric equivalent TBD) - phase 9
        'mekanism/client/render/MekanismCurioRenderer.java',
        // Third-party integrations compiled against NeoForge builds of other mods - phase 9
        // CraftTweaker add-on bridges whose targets do not exist on Fabric 1.21.1 (ProjectE, JeiTweaker)
        'mekanism/common/integration/crafttweaker/projecte/**',
        'mekanism/common/integration/crafttweaker/jeitweaker/**',
        'mekanism/common/integration/framedblocks/**',
        'mekanism/common/integration/jsonthings/**',
        // The One Probe has no Fabric build (Jade and WTHIT are supported)
        'mekanism/common/integration/lookingat/theoneprobe/**',
        'mekanism/common/integration/projecte/**',
        'mekanism/common/integration/computer/opencomputers2/**',
        'mekanism/common/integration/energy/fluxnetworks/**',
        'mekanism/common/integration/energy/grandpower/**',
        // Datagen helpers in the API (datagen is not ported, NOTES.md D11)
        'mekanism/api/datagen/**',
]
// Same-path replacements: any upstream source file whose relative path also exists in src/fabric/overrides/java is replaced by
// the override (used for stubbing optional-integration classes that core references). Listed in NOTES.md "Overrides".
def overridesDir = file('src/fabric/overrides/java')
def overriddenFiles = overridesDir.exists() ? fileTree(overridesDir).matching { include('**/*.java') }.files.collect {
    overridesDir.toPath().relativize(it.toPath()).toString().replace(File.separator, '/')
} : []

sourceSets {
    main {
        java {
            srcDirs = ['src/api/java', 'src/main/java', 'src/fabric/java', 'src/fabric/overrides/java']
            exclude(excludedFromCompile)
            // Drop the upstream copy of overridden files (but never the override itself)
            exclude { FileTreeElement e -> !e.file.toPath().startsWith(overridesDir.toPath()) && overriddenFiles.contains(e.relativePath.pathString) }
        }
        resources {
            srcDirs = ['src/main/resources', 'src/datagen/generated/mekanism', 'src/fabric/resources']
            exclude('**/*.blend', '**/*.bbmodel', '.cache', '**/convert_uv.py',
                    'META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg')
        }
    }
}

// Generators / Additions / Tools: each its own Fabric mod (src/<module> upstream code + src/fabric/<module> bootstrap)
def mekModules = ['generators', 'additions', 'tools']
def moduleExcludes = [
]
sourceSets {
    mekModules.each { moduleName ->
        create(moduleName) {
            java {
                srcDirs = ["src/${moduleName}/java", "src/fabric/${moduleName}/java"]
                exclude(moduleExcludes)
            }
            resources {
                srcDirs = ["src/${moduleName}/resources", "src/datagen/generated/mekanism${moduleName}", "src/fabric/${moduleName}/resources"]
                exclude('**/*.blend', '**/*.bbmodel', '.cache', 'META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg')
            }
            compileClasspath += main.compileClasspath + main.output
            runtimeClasspath += main.output + configurations.runtimeClasspath
        }
        main.runtimeClasspath += sourceSets.getByName(moduleName).output
    }
}
mekModules.each { moduleName ->
    configurations.named("${moduleName}AnnotationProcessor") { extendsFrom(configurations.annotationProcessor) }
    configurations.named("${moduleName}CompileOnly") { extendsFrom(configurations.compileOnly) }
}

// Upstream unit tests (src/test) plus the port's test bootstrap (src/fabric/test)
sourceSets {
    test {
        java.srcDirs = ['src/test/java', 'src/fabric/test/java']
        resources.srcDirs = ['src/test/resources', 'src/fabric/test/resources']
    }
}

// Headless functional tests (Fabric GameTest), not shipped in the mod jar
sourceSets {
    gametest {
        java.srcDirs = ['src/fabric/gametest/java']
        resources.srcDirs = ['src/fabric/gametest/resources']
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        mekanism_fabric {
            sourceSet sourceSets.main
        }
        mekanism_fabric_gametest {
            sourceSet sourceSets.gametest
        }
        mekanismgenerators_fabric {
            sourceSet sourceSets.generators
        }
        mekanismadditions_fabric {
            sourceSet sourceSets.additions
        }
        mekanismtools_fabric {
            sourceSet sourceSets.tools
        }
    }
    accessWidenerPath = file('src/fabric/resources/mekanism.accesswidener')
    mixin {
        defaultRefmapName = 'mekanism_fabric.refmap.json'
    }
    runs {
        client {
            client()
            name = 'Client'
            runDir = 'run'
        }
        server {
            server()
            name = 'Server'
            runDir = 'run/server'
        }
        gametest {
            server()
            name = 'GameTest'
            source(sourceSets.gametest)
            runDir = 'build/gametest'
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml")
        }
        // Automated in-world client check (creates a world, places machines, opens a GUI, exits)
        smokeWorld {
            client()
            name = 'Smoke World'
            runDir = 'run/smokeworld'
            vmArg('-Dmekanism_fabric.smokeWorld=true')
        }
        // Automated client boot check: exits by itself after resource loading reaches the title screen
        smokeClient {
            client()
            name = 'Smoke Client'
            runDir = 'run/smoke'
            vmArg('-Dmekanism_fabric.smokeTest=true')
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:${loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Config: real NeoForge ModConfigSpec API on Fabric (NOTES.md D7). Required dependency, not bundled.
    modApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}")
    // Energy interop (NOTES.md D8)
    modApi(include("teamreborn:energy:${tr_energy_version}"))
    // Listener event-type resolution for the shim event bus (NOTES.md D2)
    implementation(include("net.jodah:typetools:${typetools_version}"))
    // Provided transitively by NeoForge upstream
    compileOnly('com.google.code.findbugs:jsr305:3.0.2')
    implementation(include('org.apache.maven:maven-artifact:3.9.9')) { transitive = false }

    // Third-party APIs (compile only) so upstream's integration-facing code compiles unchanged. Runtime integrations are phase 9.
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    modCompileOnly("dev.emi:emi-fabric:${emi_version}:api")
    modCompileOnly("mcp.mobius.waila:wthit-api:fabric-${wthit_version}") { transitive = false }
    modCompileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    // "Looking at" overlays at dev runtime: -Plooking_at=jade|wthit (verification runs only; never bundled)
    if (project.findProperty('looking_at') == 'jade') {
        modLocalRuntime("maven.modrinth:jade:${jade_version}")
    } else if (project.findProperty('looking_at') == 'wthit') {
        modLocalRuntime("mcp.mobius.waila:wthit:fabric-${wthit_version}")
        modLocalRuntime("lol.bai:badpackets:fabric-${badpackets_version}")
    }
    modCompileOnly("com.blamejared.crafttweaker:CraftTweaker-fabric-${minecraft_version}:${crafttweaker_version}") { transitive = false }
    modCompileOnly("maven.modrinth:female-gender:${wildfire_gender_version}") { transitive = false }
    modCompileOnly("dev.emi:trinkets:${trinkets_version}") { transitive = false }
    modCompileOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}") { transitive = false }
    // Accessory slots at dev runtime: -Paccessories=trinkets (verification runs only; never bundled)
    if (project.findProperty('accessories') == 'trinkets') {
        modLocalRuntime("dev.emi:trinkets:${trinkets_version}")
    }
    // CraftTweaker at dev runtime: -Ptweaker=crt (verification runs only; never bundled)
    if (project.findProperty('tweaker') == 'crt') {
        modLocalRuntime("com.blamejared.crafttweaker:CraftTweaker-fabric-${minecraft_version}:${crafttweaker_version}")
    }
    // Wildfire's Female Gender Mod at dev runtime: -Pgender=true (verification runs only; never bundled)
    if (project.findProperty('gender') == 'true') {
        modLocalRuntime("maven.modrinth:female-gender:${wildfire_gender_version}")
    }
    // ComputerCraft at dev runtime: -Pcomputers=cc (verification runs only; never bundled)
    if (project.findProperty('computers') == 'cc') {
        modLocalRuntime("cc.tweaked:cc-tweaked-${minecraft_version}-fabric:${cc_tweaked_version}")
    }
    // Recipe viewers at dev runtime: -Precipe_viewer=jei|emi (verification runs only; never bundled)
    if (project.findProperty('recipe_viewer') == 'jei') {
        modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    } else if (project.findProperty('recipe_viewer') == 'emi') {
        modLocalRuntime("dev.emi:emi-fabric:${emi_version}")
    }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_tweaked_version}")

    // Upstream's unit tests (src/test, plain JUnit 5 + jqwik)
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junit_version}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junit_version}")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // Runs the tests inside Fabric Loader (Knot) so mixins/injected interfaces apply, like upstream's NeoForge JUnit runtime
    testImplementation("net.fabricmc:fabric-loader-junit:${loader_version}")
    testImplementation("net.jqwik:jqwik:${jqwik_version}")

    compileOnly(project(':annotation-processor'))
    annotationProcessor(project(':annotation-processor'))
}

tasks.withType(JavaCompile).configureEach { JavaCompile task ->
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    // Upstream's annotation processor needs the NeoForge module id of the source set being compiled
    def module = mekModules.find { task.name == "compile${it.capitalize()}Java" }
    options.compilerArgs.addAll(["-AmekanismModule=mekanism${module ?: ''}", '-parameters', '-Xmaxerrs', '100000'])
}

def fabricModJsonProps = ['version': project.version, 'minecraft_version': minecraft_version, 'loader_version': loader_version,
                          'fabric_version': fabric_version, 'fcap_version': fcap_version]
(['processResources'] + mekModules.collect { "process${it.capitalize()}Resources".toString() }).each { taskName ->
    tasks.named(taskName, ProcessResources) {
        inputs.properties(fabricModJsonProps)
        // Literal token replacement (not Groovy templating: injected interface keys contain '$')
        filesMatching('fabric.mod.json') {
            filter { String line -> fabricModJsonProps.inject(line) { String l, k, v -> l.replace('${' + k + '}', v.toString()) } }
        }
        from(rootProject.file('LICENSE')) { rename { 'LICENSE_mekanism' } }
        if (taskName != 'processResources') {
            // Module jars carry the shared mod icon too (the core gets it from src/fabric/resources)
            from('src/fabric/resources/assets/mekanism_fabric/icon.png') { into('assets/mekanism_fabric') }
        }
    }
}

// ---- NeoForge -> Fabric data JSON transform (NOTES.md D11) ----
// Upstream's generated data uses NeoForge load conditions and NeoForge custom ingredient type keys. The committed resources stay verbatim;
// the copies in the build output are rewritten:
//  * "neoforge:conditions": [...]       -> "fabric:load_conditions": [...]  (conditions use "condition" instead of "type")
//  * neoforge:mod_loaded {modid}        -> fabric:all_mods_loaded {values: [modid]}
//  * neoforge:not {value}               -> fabric:not {value}
//  * neoforge:and/or {values}           -> fabric:and/or {values}
//  * neoforge:tag_empty {tag}           -> fabric:not {fabric:tags_populated {registry: item, values: [tag]}}
//  * neoforge:true/false                -> fabric:true/false
//  * other conditions (mekanism:*)      -> same id, registered as Fabric resource conditions by mekanism.fabric.compat.ConditionBridge
//  * ingredient {"type": "neoforge:difference|compound|intersection|components"} -> "fabric:type" so vanilla's Fabric-patched Ingredient codec
//    dispatches them (the shim registers serializers under those ids)
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def neoIngredientTypes = ['neoforge:difference', 'neoforge:compound', 'neoforge:intersection', 'neoforge:components'] as Set

def convertCondition
convertCondition = { Map c ->
    String type = c.type
    switch (type) {
        case 'neoforge:mod_loaded': return [condition: 'fabric:all_mods_loaded', values: [c.modid]]
        case 'neoforge:not': return [condition: 'fabric:not', value: convertCondition(c.value as Map)]
        case 'neoforge:and': return [condition: 'fabric:and', values: c.values.collect { convertCondition(it as Map) }]
        case 'neoforge:or': return [condition: 'fabric:or', values: c.values.collect { convertCondition(it as Map) }]
        case 'neoforge:tag_empty': return [condition: 'fabric:not', value: [condition: 'fabric:tags_populated', registry: 'minecraft:item', values: [c.tag]]]
        case 'neoforge:true': return [condition: 'fabric:true']
        case 'neoforge:false': return [condition: 'fabric:false']
        default:
            def copy = new LinkedHashMap(c)
            copy.remove('type')
            return [condition: type] + copy  // nested conditions stay in NeoForge format (decoded by the shim's ICondition.CODEC)
    }
}

def transformJson
transformJson = { Object node ->
    if (node instanceof Map) {
        def out = new LinkedHashMap()
        node.each { k, v ->
            if (k == 'neoforge:conditions') {
                out['fabric:load_conditions'] = v.collect { convertCondition(it as Map) }
            } else if (v instanceof String && v.startsWith('#neoforge:')) {
                //NeoForge-namespaced tag references -> Fabric convention ("c") tags
                out[k] = '#c:' + v.substring('#neoforge:'.length())
            } else if (k == 'type' && neoIngredientTypes.contains(v)) {
                out['fabric:type'] = v
            } else {
                out[k] = transformJson(v)
            }
        }
        return out
    } else if (node instanceof List) {
        //NeoForge-namespaced tag references -> optional Fabric convention ("c") tag entries (not every NeoForge tag has a Fabric equivalent)
        return node.collect { it instanceof String && it.startsWith('#neoforge:') ? [id: '#c:' + it.substring('#neoforge:'.length()), required: false] : transformJson(it) }
    }
    return node
}

(['processResources'] + mekModules.collect { "process${it.capitalize()}Resources".toString() }).each { taskName -> tasks.named(taskName, ProcessResources) {
    doLast {
        def dataDir = new File(destinationDir, 'data')
        if (dataDir.exists()) {
            dataDir.eachFileRecurse { File f ->
                if (f.name.endsWith('.json')) {
                    String text = f.getText('UTF-8')
                    if (text.contains('neoforge:')) {
                        f.setText(JsonOutput.toJson(transformJson(new JsonSlurper().parseText(text))), 'UTF-8')
                    }
                }
            }
        }
    }
}
}

// GameTest run with CraftTweaker: install the test script (and remove it again otherwise)
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst {
        def scripts = file('build/gametest/scripts')
        if (project.findProperty('tweaker') == 'crt') {
            copy { from('src/fabric/gametest/scripts'); into(scripts) }
        } else {
            delete(file('build/gametest/scripts/mekanism_port_test.zs'))
        }
    }
}

// Release jars: core (remapJar) plus one remapped jar per module, like upstream's separate Mekanism / Generators / Additions / Tools jars
mekModules.each { moduleName ->
    def displayName = "Mekanism${moduleName.capitalize()}-Fabric-Unofficial"
    def moduleJar = tasks.register("${moduleName}Jar", Jar) {
        archiveBaseName = displayName
        archiveClassifier = 'dev'
        destinationDirectory = layout.buildDirectory.dir('devlibs')
        from(sourceSets.getByName(moduleName).output)
    }
    def remapModuleJar = tasks.register("remap${moduleName.capitalize()}Jar", net.fabricmc.loom.task.RemapJarTask) {
        inputFile = moduleJar.flatMap { it.archiveFile }
        // Inherited Minecraft members called through core/module subclasses must be resolvable while remapping
        classpath.from(sourceSets.getByName(moduleName).compileClasspath)
        archiveBaseName = displayName
        addNestedDependencies = false
    }
    tasks.named('build') { dependsOn(remapModuleJar) }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
// jqwik's engine does not discover tests under fabric-loader-junit's Knot launcher; upstream's property tests need no game, so run them plainly
def propertyTest = tasks.register('propertyTest', Test) {
    description = 'Runs upstream jqwik property tests outside Knot'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('fabric-loader-junit') }
    useJUnitPlatform { includeEngines('jqwik') }
}
tasks.named('check') { dependsOn(propertyTest) }

// Production (intermediary) runs of the release jars, for verification: the same automated smoke checks as the dev runs
def productionMods = configurations.detachedConfiguration(
        dependencies.create("net.fabricmc.fabric-api:fabric-api:${fabric_version}"),
        dependencies.create("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"))
productionMods.transitive = false
['prodSmokeClient': 'mekanism_fabric.smokeTest', 'prodSmokeWorld': 'mekanism_fabric.smokeWorld'].each { taskName, flag ->
    tasks.register(taskName, net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        group = 'verification'
        dependsOn('build', bridgeReleaseJars)
        mods.from(tasks.named('remapJar'))
        mekModules.each { mods.from(tasks.named("remap${it.capitalize()}Jar")) }
        mods.from(productionMods)
        jvmArgs.add("-D${flag}=true")
        runDir = file("run/${taskName}")
    }
}

// Remapping trap: some Mekanism interfaces declare methods that classes only "implement" through an inherited Minecraft method (BlockEntity#getLevel,
// #getBlockPos). Remapping renames the Minecraft method to intermediary but not Mekanism's own declarations, which throws AbstractMethodError in
// production. After remapping, every Mekanism-declared method with one of these exact signatures (still named after its Mojang name) is renamed, with its
// references, to the intermediary name of the vanilla method it mirrors - consistently across all jars. scripts/ImplChecker.java
// (checkRemappedImplementations) verifies that no such gap remains.
def interfaceBridgeRules = [
        // [named name, intermediary descriptor, intermediary name of the Minecraft method it mirrors]
        ['getLevel', '()Lnet/minecraft/class_1937;', 'method_10997'],
        ['getBlockPos', '()Lnet/minecraft/class_2338;', 'method_11016'],
]
def collectBridgeMappings = { List<File> jars ->
    def found = []
    jars.each { File jarFile ->
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().findAll { it.name.endsWith('.class') && it.name.startsWith('mekanism/') }.each { entry ->
                def reader = new org.objectweb.asm.ClassReader(zip.getInputStream(entry).bytes)
                def owner = reader.className
                reader.accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
                    @Override
                    org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String desc, String signature, String[] exceptions) {
                        def rule = interfaceBridgeRules.find { it[0] == name && it[1] == desc }
                        if (rule != null && (access & org.objectweb.asm.Opcodes.ACC_STATIC) == 0) {
                            found << [owner, name, desc, rule[2]]
                        }
                        return null
                    }
                }, org.objectweb.asm.ClassReader.SKIP_CODE)
            }
        }
    }
    return found
}
def intermediaryMinecraft = { loom.getMinecraftJars(net.fabricmc.loom.api.mappings.layered.MappingsNamespace.INTERMEDIARY) }
// One TinyRemapper pass over all release jars together, so hierarchy and references resolve across jars (module classes inherit core methods).
// Idempotent: once renamed, no matching Mojang-named declarations remain.
def releaseJarTasks = { [tasks.named('remapJar')] + mekModules.collect { tasks.named("remap${it.capitalize()}Jar") } }
def bridgeReleaseJars = tasks.register('bridgeReleaseJars') {
    description = 'Renames Mekanism methods that mirror inherited Minecraft methods to their intermediary names in the release jars'
    dependsOn(releaseJarTasks())
    doLast {
        def jars = releaseJarTasks().collect { it.get().archiveFile.get().asFile }
        def mappings = collectBridgeMappings(jars)
        if (mappings.isEmpty()) {
            return
        }
        def remapper = net.fabricmc.tinyremapper.TinyRemapper.newRemapper()
                .withMappings({ acceptor -> mappings.each { m -> acceptor.acceptMethod(new net.fabricmc.tinyremapper.IMappingProvider.Member(m[0], m[1], m[2]), m[3]) } } as net.fabricmc.tinyremapper.IMappingProvider)
                .build()
        def outputs = []
        try {
            intermediaryMinecraft().each { remapper.readClassPath(it) }
            def tagged = jars.collect { jar ->
                // Must end in .jar: TinyRemapper's output consumer treats other paths as directories
                def output = new File(jar.parentFile, jar.name.replace('.jar', '-bridged.jar')).toPath()
                def tag = remapper.createInputTag()
                remapper.readInputs(tag, jar.toPath())
                [jar.toPath(), output, tag]
            }
            tagged.each { input, output, tag ->
                def consumer = new net.fabricmc.tinyremapper.OutputConsumerPath.Builder(output).build()
                try {
                    consumer.addNonClassFiles(input, net.fabricmc.tinyremapper.NonClassCopyMode.UNCHANGED, remapper)
                    remapper.apply(consumer, tag)
                } finally {
                    consumer.close()
                }
                outputs << [input, output]
            }
        } finally {
            remapper.finish()
        }
        outputs.each { input, output -> java.nio.file.Files.move(output, input, java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
        logger.lifecycle("Bridged ${mappings.size()} Mekanism method declarations in ${jars.size()} release jars")
    }
}
tasks.named('build') { dependsOn(bridgeReleaseJars) }
def implCheckerClasspath = configurations.detachedConfiguration(dependencies.create('org.ow2.asm:asm:9.7.1'))
def checkRemappedImplementations = tasks.register('checkRemappedImplementations', JavaExec) {
    group = 'verification'
    description = 'Fails if a class in the release jars leaves an interface method unimplemented after remapping'
    dependsOn(bridgeReleaseJars)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of("${java_version}") }
    classpath = implCheckerClasspath
    mainClass = 'ImplChecker'
    def releaseJars = [tasks.named('remapJar')] + mekModules.collect { tasks.named("remap${it.capitalize()}Jar") }
    doFirst {
        // Libraries: Minecraft (intermediary) and the Fabric API modules (their interfaces are injected into Minecraft classes too)
        def fabricApiJars = configurations.modCompileClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'net.fabricmc.fabric-api' }.collect { it.file.absolutePath }
        args = ['--fail', releaseJars.collect { it.get().archiveFile.get().asFile.absolutePath }.join(','),
                (intermediaryMinecraft().collect { it.toAbsolutePath().toString() } + fabricApiJars).join(',')]
        // Single-file source launch
        jvmArgs = []
        mainClass.set(file('scripts/ImplChecker.java').absolutePath)
    }
}
tasks.named('check') { dependsOn(checkRemappedImplementations) }
