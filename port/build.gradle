plugins {
    id('net.fabricmc.fabric-loom').version("${loom_version}")
    id('java')
}

// Unofficial Fabric port of Mekanism (https://github.com/mekanism/Mekanism). See ../NOTES.md.
version = "${mod_version}+fabric.${port_revision}"
group = 'mekanism'
base { archivesName = 'MekanismFabricated-Core' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'Fuzs (Forge Config API Port)'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository { maven { name = 'TerraformersMC (EMI)'; url = 'https://maven.terraformersmc.com/releases' } }
        filter { includeGroup('dev.emi') }
    }
    exclusiveContent {
        forRepository { maven { name = 'SquidDev (CC: Tweaked)'; url = 'https://maven.squiddev.cc' } }
        filter { includeGroup('cc.tweaked') }
    }
    exclusiveContent {
        // Only needed by upstream's annotation processor
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup('org.openzen.zencode'); includeGroup('com.blamejared.crafttweaker'); includeGroupByRegex('com[.]faux.*') }
    }
    exclusiveContent {
        forRepository { maven { name = 'bai (WTHIT)'; url = 'https://maven2.bai.lol' } }
        filter { includeGroup('mcp.mobius.waila'); includeGroup('lol.bai') }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository { maven { name = 'Ladysnake (Cardinal Components, used by Trinkets)'; url = 'https://maven.ladysnake.org/releases' } }
        filter { includeGroup('org.ladysnake.cardinal-components-api') }
    }
    mavenCentral()
}

// Packages from upstream that are not (yet) compiled in the Fabric port. Each entry is tracked in NOTES.md "Stubbed / disabled".
def excludedFromCompile = [
        // 26.1 port, phase 1: all third-party integrations are compiled out until core builds
        'mekanism/client/recipe_viewer/jei/**',
        'mekanism/client/recipe_viewer/emi/**',
        'mekanism/common/integration/crafttweaker/**',
        'mekanism/common/integration/lookingat/**',
        'mekanism/common/integration/computer/computercraft/**',
        'mekanism/common/integration/gender/**',
        'mekanism/api/integration/emi/**',
        'mekanism/api/integration/jei/**',
        'mekanism/fabric/compat/computer/**',
        'mekanism/fabric/compat/recipeviewer/**',
        'mekanism/fabric/compat/trinkets/**',
        // Curios client renderer (Curios is NeoForge-only; Fabric equivalent TBD) - phase 9
        'mekanism/client/render/MekanismCurioRenderer.java',
        // Third-party integrations compiled against NeoForge builds of other mods - phase 9
        // CraftTweaker add-on bridges whose targets do not exist on Fabric 1.21.1 (ProjectE, JeiTweaker)
        'mekanism/common/integration/crafttweaker/projecte/**',
        'mekanism/common/integration/crafttweaker/jeitweaker/**',
        'mekanism/common/integration/framedblocks/**',
        'mekanism/common/integration/jsonthings/**',
        // The One Probe has no Fabric build (Jade and WTHIT are supported)
        'mekanism/common/integration/lookingat/theoneprobe/**',
        'mekanism/common/integration/projecte/**',
        'mekanism/common/integration/computer/opencomputers2/**',
        'mekanism/common/integration/energy/fluxnetworks/**',
        'mekanism/common/integration/energy/grandpower/**',
        // Datagen helpers in the API (datagen is not ported, NOTES.md D11)
        'mekanism/api/datagen/**',
]
// Same-path replacements: any upstream source file whose relative path also exists in src/fabric/overrides/java is replaced by
// the override (used for stubbing optional-integration classes that core references). Listed in NOTES.md "Overrides".
def overridesDir = file('src/fabric/overrides/java')
def overriddenFiles = overridesDir.exists() ? fileTree(overridesDir).matching { include('**/*.java') }.files.collect {
    overridesDir.toPath().relativize(it.toPath()).toString().replace(File.separator, '/')
} : []

sourceSets {
    main {
        java {
            srcDirs = ['src/api/java', 'src/main/java', 'src/fabric/java', 'src/fabric/overrides/java']
            exclude(excludedFromCompile)
            // Drop the upstream copy of overridden files (but never the override itself)
            exclude { FileTreeElement e -> !e.file.toPath().startsWith(overridesDir.toPath()) && overriddenFiles.contains(e.relativePath.pathString) }
        }
        resources {
            srcDirs = ['src/main/resources', 'src/datagen/generated/mekanism', 'src/fabric/resources']
            exclude('**/*.blend', '**/*.bbmodel', '.cache', '**/convert_uv.py',
                    'META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg')
        }
    }
}

// Generators / Additions / Tools: each its own Fabric mod (src/<module> upstream code + src/fabric/<module> bootstrap)
def mekModules = []  // 26.1: core only for now; modules come back once core builds
def moduleExcludes = [
]
sourceSets {
    mekModules.each { moduleName ->
        create(moduleName) {
            java {
                srcDirs = ["src/${moduleName}/java", "src/fabric/${moduleName}/java"]
                exclude(moduleExcludes)
            }
            resources {
                srcDirs = ["src/${moduleName}/resources", "src/datagen/generated/mekanism${moduleName}", "src/fabric/${moduleName}/resources"]
                exclude('**/*.blend', '**/*.bbmodel', '.cache', 'META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg')
            }
            compileClasspath += main.compileClasspath + main.output
            runtimeClasspath += main.output + configurations.runtimeClasspath
        }
        main.runtimeClasspath += sourceSets.getByName(moduleName).output
    }
}
mekModules.each { moduleName ->
    configurations.named("${moduleName}AnnotationProcessor") { extendsFrom(configurations.annotationProcessor) }
    configurations.named("${moduleName}CompileOnly") { extendsFrom(configurations.compileOnly) }
}

// Upstream unit tests (src/test) plus the port's test bootstrap (src/fabric/test)
sourceSets {
    test {
        java.srcDirs = ['src/test/java', 'src/fabric/test/java']
        resources.srcDirs = ['src/test/resources', 'src/fabric/test/resources']
    }
}

// Headless functional tests (Fabric GameTest), not shipped in the mod jar
sourceSets {
    gametest {
        java.srcDirs = ['src/fabric/gametest/java']
        resources.srcDirs = ['src/fabric/gametest/resources']
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        mekanism_fabric {
            sourceSet sourceSets.main
        }
        mekanism_fabric_gametest {
            sourceSet sourceSets.gametest
        }
    }
    accessWidenerPath = file('src/fabric/resources/mekanism.accesswidener')
    runs {
        client {
            client()
            name = 'Client'
            runDir = 'run'
        }
        server {
            server()
            name = 'Server'
            runDir = 'run/server'
        }
        gametest {
            server()
            name = 'GameTest'
            source(sourceSets.gametest)
            runDir = 'build/gametest'
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml")
        }
        // Automated in-world client check (creates a world, places machines, opens a GUI, exits)
        smokeWorld {
            client()
            name = 'Smoke World'
            runDir = 'run/smokeworld'
            vmArg('-Dmekanism_fabric.smokeWorld=true')
        }
        // Automated screenshots for the project pages (ScreenshotDriver): saved to run/screenshots/screenshots/
        screenshots {
            client()
            name = 'Screenshots'
            runDir = 'run/screenshots'
            vmArg('-Dmekanism_fabric.screenshots=true')
            programArgs('--width', '1600', '--height', '900')
        }
        // Automated client boot check: exits by itself after resource loading reaches the title screen
        smokeClient {
            client()
            name = 'Smoke Client'
            runDir = 'run/smoke'
            vmArg('-Dmekanism_fabric.smokeTest=true')
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Config: real NeoForge ModConfigSpec API on Fabric (NOTES.md D7). Required dependency, not bundled.
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}")
    // Energy interop (NOTES.md D8)
    implementation(include("teamreborn:energy:${tr_energy_version}"))
    // Listener event-type resolution for the shim event bus (NOTES.md D2)
    implementation(include("net.jodah:typetools:${typetools_version}"))
    // Provided transitively by NeoForge upstream
    compileOnly('com.google.code.findbugs:jsr305:3.0.2')
    implementation(include('org.apache.maven:maven-artifact:3.9.9')) { transitive = false }

    // 26.1 port: third-party integration APIs are re-added per integration once core builds

    // Upstream's unit tests (src/test, plain JUnit 5 + jqwik)
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junit_version}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junit_version}")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // Runs the tests inside Fabric Loader (Knot) so mixins/injected interfaces apply, like upstream's NeoForge JUnit runtime
    testImplementation("net.fabricmc:fabric-loader-junit:${loader_version}")
    testImplementation("net.jqwik:jqwik:${jqwik_version}")

    compileOnly(project(':annotation-processor'))
    annotationProcessor(project(':annotation-processor'))
}

tasks.withType(JavaCompile).configureEach { JavaCompile task ->
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    // Upstream's annotation processor needs the NeoForge module id of the source set being compiled
    def module = mekModules.find { task.name == "compile${it.capitalize()}Java" }
    options.compilerArgs.addAll(["-AmekanismModule=mekanism${module ?: ''}", '-parameters', '-Xmaxerrs', '100000'])
}

def fabricModJsonProps = ['version': project.version, 'minecraft_version': minecraft_version, 'loader_version': loader_version,
                          'fabric_version': fabric_version, 'fcap_version': fcap_version]
(['processResources'] + mekModules.collect { "process${it.capitalize()}Resources".toString() }).each { taskName ->
    tasks.named(taskName, ProcessResources) {
        inputs.properties(fabricModJsonProps)
        // Literal token replacement (not Groovy templating: injected interface keys contain '$')
        filesMatching('fabric.mod.json') {
            filter { String line -> fabricModJsonProps.inject(line) { String l, k, v -> l.replace('${' + k + '}', v.toString()) } }
        }
        from(rootProject.file('LICENSE')) { rename { 'LICENSE_mekanism' } }
        if (taskName != 'processResources') {
            // Module jars carry the shared mod icon too (the core gets it from src/fabric/resources)
            from('src/fabric/resources/assets/mekanism_fabric/icon.png') { into('assets/mekanism_fabric') }
        }
    }
}

// ---- NeoForge -> Fabric data JSON transform (NOTES.md D11) ----
// Upstream's generated data uses NeoForge load conditions and NeoForge custom ingredient type keys. The committed resources stay verbatim;
// the copies in the build output are rewritten:
//  * "neoforge:conditions": [...]       -> "fabric:load_conditions": [...]  (conditions use "condition" instead of "type")
//  * neoforge:mod_loaded {modid}        -> fabric:all_mods_loaded {values: [modid]}
//  * neoforge:not {value}               -> fabric:not {value}
//  * neoforge:and/or {values}           -> fabric:and/or {values}
//  * neoforge:tag_empty {tag}           -> fabric:not {fabric:tags_populated {registry: item, values: [tag]}}
//  * neoforge:true/false                -> fabric:true/false
//  * other conditions (mekanism:*)      -> same id, registered as Fabric resource conditions by mekanism.fabric.compat.ConditionBridge
//  * custom ingredients {"neoforge:ingredient_type": "neoforge:difference|compound|intersection|components", ...} -> key "fabric:type" so
//    vanilla's Fabric-patched Ingredient codec dispatches them (the shim registers serializers under those ids; the shim's FluidIngredient
//    codec accepts either key)
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def convertCondition
convertCondition = { Map c ->
    String type = c.type
    switch (type) {
        case 'neoforge:mod_loaded': return [condition: 'fabric:all_mods_loaded', values: [c.modid]]
        case 'neoforge:not': return [condition: 'fabric:not', value: convertCondition(c.value as Map)]
        case 'neoforge:and': return [condition: 'fabric:and', values: c.values.collect { convertCondition(it as Map) }]
        case 'neoforge:or': return [condition: 'fabric:or', values: c.values.collect { convertCondition(it as Map) }]
        case 'neoforge:tag_empty': return [condition: 'fabric:not', value: [condition: 'fabric:tags_populated', registry: 'minecraft:item', values: [c.tag]]]
        case 'neoforge:true': return [condition: 'fabric:true']
        case 'neoforge:false': return [condition: 'fabric:false']
        default:
            def copy = new LinkedHashMap(c)
            copy.remove('type')
            return [condition: type] + copy  // nested conditions stay in NeoForge format (decoded by the shim's ICondition.CODEC)
    }
}

def transformJson
transformJson = { Object node ->
    if (node instanceof Map) {
        def out = new LinkedHashMap()
        node.each { k, v ->
            if (k == 'neoforge:conditions') {
                out['fabric:load_conditions'] = v.collect { convertCondition(it as Map) }
            } else if (v instanceof String && v.startsWith('#neoforge:')) {
                //NeoForge-namespaced tag references -> Fabric convention ("c") tags
                out[k] = '#c:' + v.substring('#neoforge:'.length())
            } else if (k == 'neoforge:ingredient_type') {
                out['fabric:type'] = v
            } else {
                out[k] = transformJson(v)
            }
        }
        return out
    } else if (node instanceof List) {
        //NeoForge-namespaced tag references -> optional Fabric convention ("c") tag entries (not every NeoForge tag has a Fabric equivalent)
        return node.collect { it instanceof String && it.startsWith('#neoforge:') ? [id: '#c:' + it.substring('#neoforge:'.length()), required: false] : transformJson(it) }
    }
    return node
}

(['processResources'] + mekModules.collect { "process${it.capitalize()}Resources".toString() }).each { taskName -> tasks.named(taskName, ProcessResources) {
    doLast {
        // Model JSON: NeoForge selects custom model loaders with "loader", Fabric's model deserializer with "fabric:type"
        def assetsDir = new File(destinationDir, 'assets')
        if (assetsDir.exists()) {
            assetsDir.eachFileRecurse { File f ->
                if (f.name.endsWith('.json') && f.path.replace(File.separator, '/').contains('/models/')) {
                    String text = f.getText('UTF-8')
                    if (text.contains('"loader"')) {
                        def json = new JsonSlurper().parseText(text)
                        if (json instanceof Map && json.containsKey('loader')) {
                            json['fabric:type'] = json.remove('loader')
                            f.setText(JsonOutput.toJson(json), 'UTF-8')
                        }
                    }
                }
            }
        }
        def dataDir = new File(destinationDir, 'data')
        if (dataDir.exists()) {
            dataDir.eachFileRecurse { File f ->
                if (f.name.endsWith('.json')) {
                    String text = f.getText('UTF-8')
                    if (text.contains('neoforge:')) {
                        f.setText(JsonOutput.toJson(transformJson(new JsonSlurper().parseText(text))), 'UTF-8')
                    }
                }
            }
        }
    }
}
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
// jqwik's engine does not discover tests under fabric-loader-junit's Knot launcher; upstream's property tests need no game, so run them plainly
def propertyTest = tasks.register('propertyTest', Test) {
    description = 'Runs upstream jqwik property tests outside Knot'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('fabric-loader-junit') }
    useJUnitPlatform { includeEngines('jqwik') }
}
tasks.named('check') { dependsOn(propertyTest) }

// Release: 26.1 is not obfuscated, so the jar task output is the release jar (no remapping, no interface bridges needed)
