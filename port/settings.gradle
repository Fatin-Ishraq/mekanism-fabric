pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a Java 21 toolchain when none is installed
    id('org.gradle.toolchains.foojay-resolver-convention').version('1.0.0')
}

rootProject.name = 'mekanism-fabric'
include('annotation-processor')
